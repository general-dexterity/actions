name: "Deploy to Cloudflare (Production)"
description: "Deploy to Cloudflare Workers production traffic using versions"

inputs:
  cloudflare-api-token:
    description: "Cloudflare API token"
    required: true
  cloudflare-account-id:
    description: "Cloudflare account ID"
    required: true
  environment-url:
    description: "Deployment URL (e.g., https://example.com)"
    required: true
  environment-name:
    description: "GitHub environment name"
    required: false
    default: "production"
  version-message:
    description: "Message to attach to the version (e.g., commit hash and message)"
    required: false
  github-token:
    description: "GitHub token for deployment status"
    required: true
  working-directory:
    description: "Directory containing wrangler.toml/wrangler.jsonc"
    required: false

outputs:
  deployment-id:
    description: "GitHub deployment ID"
    value: ${{ steps.deployment.outputs.deployment-id }}
  version-id:
    description: "Cloudflare version ID"
    value: ${{ steps.extract-version.outputs.version-id }}

runs:
  using: "composite"
  steps:
    - name: Create GitHub Deployment
      id: deployment
      uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const deployment = await github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha,
            environment: '${{ inputs.environment-name }}',
            auto_merge: false,
            required_contexts: [],
          });
          core.setOutput('deployment-id', deployment.data.id);

    - name: Normalize version message
      id: normalize-version-message
      shell: bash
      env:
        RAW_VERSION_MESSAGE: ${{ inputs.version-message }}
      run: |
        SAFE_VERSION_MESSAGE=$(printf '%s' "$RAW_VERSION_MESSAGE" | tr '\n\r' ' ' | sed 's/[[:space:]]\+/ /g' | sed 's/"/\\"/g' | sed 's/^ //; s/ $//')
        echo "safe-version-message=$SAFE_VERSION_MESSAGE" >> $GITHUB_OUTPUT

    - name: Upload version
      id: upload
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: |
        STDOUT_FILE=$(mktemp)
        STDERR_FILE=$(mktemp)

        set +e
        pnpm wrangler versions upload ${{ steps.normalize-version-message.outputs.safe-version-message && format('--message "{0}"', steps.normalize-version-message.outputs.safe-version-message) || '' }} > "$STDOUT_FILE" 2> "$STDERR_FILE"
        EXIT_CODE=$?
        set -e

        STDOUT=$(cat "$STDOUT_FILE")
        STDERR=$(cat "$STDERR_FILE")

        if [ -n "$STDOUT" ]; then echo "$STDOUT"; fi
        if [ -n "$STDERR" ]; then echo "$STDERR" >&2; fi

        {
          echo "command-output<<WRANGLER_EOF"
          echo "$STDOUT"
          echo "WRANGLER_EOF"
        } >> "$GITHUB_OUTPUT"

        rm -f "$STDOUT_FILE" "$STDERR_FILE"
        exit $EXIT_CODE

    - name: Extract version ID
      id: extract-version
      shell: bash
      env:
        UPLOAD_OUTPUT: ${{ steps.upload.outputs.command-output }}
      run: |
        VERSION_ID=$(echo "$UPLOAD_OUTPUT" | grep -oP 'Worker Version ID: \K[a-f0-9-]+')
        echo "version-id=$VERSION_ID" >> $GITHUB_OUTPUT

    - name: Deploy version to production
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
      run: |
        pnpm wrangler versions deploy ${{ steps.extract-version.outputs.version-id }}@100% -y

    - name: Update Deployment Status
      if: always()
      uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const deploymentId = '${{ steps.deployment.outputs.deployment-id }}';
          if (!deploymentId) return;

          const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
          await github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: parseInt(deploymentId),
            state,
            environment_url: '${{ inputs.environment-url }}',
          });
