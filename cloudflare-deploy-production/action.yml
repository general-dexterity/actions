name: "Deploy to Cloudflare (Production)"
description: "Deploy to Cloudflare Workers production traffic using versions"

inputs:
  cloudflare-api-token:
    description: "Cloudflare API token"
    required: true
  cloudflare-account-id:
    description: "Cloudflare account ID"
    required: true
  environment-url:
    description: "Deployment URL (e.g., https://example.com)"
    required: true
  environment-name:
    description: "GitHub environment name"
    required: false
    default: "production"
  version-message:
    description: "Message to attach to the version (e.g., commit hash and message)"
    required: false
  github-token:
    description: "GitHub token for deployment status"
    required: true
  working-directory:
    description: "Directory containing wrangler.toml/wrangler.jsonc"
    required: false

outputs:
  deployment-id:
    description: "GitHub deployment ID"
    value: ${{ steps.deployment.outputs.deployment_id }}
  version-id:
    description: "Cloudflare version ID"
    value: ${{ steps.extract-version.outputs.version-id }}

runs:
  using: "composite"
  steps:
    - name: Create GitHub Deployment
      uses: chrnorm/deployment-action@v2
      id: deployment
      with:
        token: ${{ inputs.github-token }}
        environment: ${{ inputs.environment-name }}
        environment-url: ${{ inputs.environment-url }}

    - name: Normalize version message
      id: normalize-version-message
      shell: bash
      env:
        RAW_VERSION_MESSAGE: ${{ inputs.version-message }}
      run: |
        SAFE_VERSION_MESSAGE=$(printf '%s' "$RAW_VERSION_MESSAGE" | tr '\n\r' ' ' | sed 's/[[:space:]]\+/ /g' | sed 's/"/\\"/g' | sed 's/^ //; s/ $//')
        echo "safe-version-message=$SAFE_VERSION_MESSAGE" >> $GITHUB_OUTPUT

    - name: Upload version
      uses: cloudflare/wrangler-action@v3
      id: upload
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        workingDirectory: ${{ inputs.working-directory }}
        command: versions upload ${{ steps.normalize-version-message.outputs.safe-version-message && format('--message "{0}"', steps.normalize-version-message.outputs.safe-version-message) || '' }}

    - name: Extract version ID
      id: extract-version
      shell: bash
      run: |
        VERSION_ID=$(echo "${{ steps.upload.outputs.command-output }}" | grep -oP 'Worker Version ID: \K[a-f0-9-]+')
        echo "version-id=$VERSION_ID" >> $GITHUB_OUTPUT

    - name: Deploy version to production
      uses: cloudflare/wrangler-action@v3
      with:
        apiToken: ${{ inputs.cloudflare-api-token }}
        accountId: ${{ inputs.cloudflare-account-id }}
        workingDirectory: ${{ inputs.working-directory }}
        command: versions deploy ${{ steps.extract-version.outputs.version-id }}@100% -y

    - name: Update Deployment Status
      if: always()
      uses: chrnorm/deployment-status@v2
      with:
        token: ${{ inputs.github-token }}
        deployment-id: ${{ steps.deployment.outputs.deployment_id }}
        environment-url: ${{ inputs.environment-url }}
        state: ${{ job.status == 'success' && 'success' || 'failure' }}
