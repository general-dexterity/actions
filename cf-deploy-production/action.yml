name: "Deploy to Cloudflare (Production, cf)"
description: "Deploy to Cloudflare Workers production traffic using versions, via the cf CLI. Requires the cf package installed in the project (cf reads cloudflare.config.ts)."

inputs:
  cloudflare-api-token:
    description: "Cloudflare API token"
    required: true
  cloudflare-account-id:
    description: "Cloudflare account ID"
    required: true
  environment-url:
    description: "Deployment URL (e.g., https://example.com)"
    required: true
  environment-name:
    description: "GitHub environment name"
    required: false
    default: "production"
  version-message:
    description: "Message to attach to the version (e.g., commit hash and message)"
    required: false
  mode:
    description: "cf mode used to evaluate cloudflare.config.ts (optional)"
    required: false
  github-token:
    description: "GitHub token for deployment status"
    required: true
  working-directory:
    description: "Directory containing cloudflare.config.ts"
    required: false

outputs:
  deployment-id:
    description: "GitHub deployment ID"
    value: ${{ steps.deployment.outputs.deployment-id }}
  version-id:
    description: "Cloudflare version ID"
    value: ${{ steps.extract-version.outputs.version-id }}

runs:
  using: "composite"
  steps:
    - name: Create GitHub Deployment
      id: deployment
      uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const deployment = await github.rest.repos.createDeployment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.sha,
            environment: '${{ inputs.environment-name }}',
            auto_merge: false,
            required_contexts: [],
          });
          core.setOutput('deployment-id', deployment.data.id);

    - name: Normalize version message
      id: normalize-version-message
      shell: bash
      env:
        RAW_VERSION_MESSAGE: ${{ inputs.version-message }}
      run: |
        SAFE_VERSION_MESSAGE=$(printf '%s' "$RAW_VERSION_MESSAGE" | tr '\n\r' ' ' | sed 's/[[:space:]]\+/ /g' | sed 's/"/\\"/g' | sed 's/^ //; s/ $//')
        echo "safe-version-message=$SAFE_VERSION_MESSAGE" >> $GITHUB_OUTPUT

    - name: Upload version
      id: upload
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CF_VERSION_MESSAGE: ${{ steps.normalize-version-message.outputs.safe-version-message }}
        CF_MODE: ${{ inputs.mode }}
      run: |
        STDOUT_FILE=$(mktemp)
        STDERR_FILE=$(mktemp)

        MODE_FLAG=""
        if [ -n "$CF_MODE" ]; then MODE_FLAG="--mode $CF_MODE"; fi
        MESSAGE_FLAG=""
        if [ -n "$CF_VERSION_MESSAGE" ]; then MESSAGE_FLAG="--message \"$CF_VERSION_MESSAGE\""; fi

        set +e
        eval pnpm exec cf workers versions create $MODE_FLAG $MESSAGE_FLAG > "$STDOUT_FILE" 2> "$STDERR_FILE"
        EXIT_CODE=$?
        set -e

        STDOUT=$(cat "$STDOUT_FILE")
        STDERR=$(cat "$STDERR_FILE")

        if [ -n "$STDOUT" ]; then echo "$STDOUT"; fi
        if [ -n "$STDERR" ]; then echo "$STDERR" >&2; fi

        {
          echo "command-output<<CF_EOF"
          echo "$STDOUT"
          echo "CF_EOF"
        } >> "$GITHUB_OUTPUT"

        rm -f "$STDOUT_FILE" "$STDERR_FILE"
        exit $EXIT_CODE

    - name: Extract version ID
      id: extract-version
      shell: bash
      env:
        UPLOAD_OUTPUT: ${{ steps.upload.outputs.command-output }}
      run: |
        # cf project commands print human output ("Worker Version ID: <uuid>");
        # fall back to the JSON key in case the format is JSON.
        VERSION_ID=$(printf '%s' "$UPLOAD_OUTPUT" | grep -oE 'Worker Version ID: [a-f0-9-]{36}' | head -1 | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}')
        if [ -z "$VERSION_ID" ]; then
          VERSION_ID=$(printf '%s' "$UPLOAD_OUTPUT" | grep -oE '"(version_id|id)"[[:space:]]*:[[:space:]]*"[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}"' | head -1 | grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}')
        fi
        if [ -z "$VERSION_ID" ]; then
          echo "Could not extract a version ID from cf output:" >&2
          printf '%s\n' "$UPLOAD_OUTPUT" >&2
          exit 1
        fi
        echo "version-id=$VERSION_ID" >> $GITHUB_OUTPUT

    - name: Deploy version to production
      shell: bash
      working-directory: ${{ inputs.working-directory || '.' }}
      env:
        CLOUDFLARE_API_TOKEN: ${{ inputs.cloudflare-api-token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.cloudflare-account-id }}
        CF_VERSION_ID: ${{ steps.extract-version.outputs.version-id }}
        CF_MODE: ${{ inputs.mode }}
      run: |
        MODE_FLAG=""
        if [ -n "$CF_MODE" ]; then MODE_FLAG="--mode $CF_MODE"; fi
        pnpm exec cf workers deployments create $MODE_FLAG --strategy percentage --versions "[{\"version_id\":\"$CF_VERSION_ID\",\"percentage\":100}]"

    - name: Update Deployment Status
      if: always()
      uses: actions/github-script@v8
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const deploymentId = '${{ steps.deployment.outputs.deployment-id }}';
          if (!deploymentId) return;

          const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
          await github.rest.repos.createDeploymentStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            deployment_id: parseInt(deploymentId),
            state,
            environment_url: '${{ inputs.environment-url }}',
          });
